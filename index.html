<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#FBBF24">
    <link rel="manifest" href="manifest.json">
    <title>✨ 我的笔记本</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: #FFFBF0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        .header {
            background: linear-gradient(to right, #FBBF24, #FB923C);
            padding: 20px;
            text-align: center;
            color: #78350F;
        }
        .header h1 { font-size: 24px; margin-bottom: 5px; }
        .header p { font-size: 12px; }
        .container { flex: 1; overflow-y: auto; padding: 15px; }
        .date-section {
            background: white;
            padding: 15px;
            border-radius: 12px;
            border: 2px solid #FCD34D;
            margin-bottom: 15px;
        }
        .date-controls {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }
        .date-btn {
            flex: 1;
            padding: 10px;
            background: #FCD34D;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
        .date-input {
            flex: 1.5;
            padding: 10px;
            border: 2px solid #FCD34D;
            border-radius: 8px;
        }
        .date-display {
            text-align: center;
            font-size: 13px;
            color: #92400E;
        }
        .toolbar {
            background: white;
            padding: 12px;
            border-radius: 8px;
            border: 2px solid #FCD34D;
            margin-bottom: 15px;
        }
        .toolbar-row {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }
        .toolbar-row:last-child { margin-bottom: 0; }
        .toolbar-btn {
            flex: 1;
            padding: 10px;
            background: #FCD34D;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        .color-btn {
            flex: 1;
            height: 48px;
            border-radius: 8px;
            border: 2px solid #999;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000;
            font-weight: bold;
            font-size: 12px;
        }
        .notebook-area {
            background: #FEF3C7;
            border: 3px solid #FCD34D;
            border-radius: 12px;
            padding: 0;
            margin-bottom: 15px;
            flex: 1;
            overflow: hidden;
        }
        .notebook-area div {
            width: 100%;
            height: 100%;
            overflow-y: auto;
            outline: none;
            color: #92400E;
            font-size: 16px;
            font-family: Arial, sans-serif;
            padding: 15px;
            line-height: 1.8em;
        }
        .button-group { padding: 15px; display: flex; gap: 10px; }
        .save-btn {
            flex: 1;
            padding: 12px;
            background: linear-gradient(to right, #FBBF24, #FB923C);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
        .footer {
            background: linear-gradient(to right, #FBBF24, #FB923C);
            color: #78350F;
            text-align: center;
            padding: 12px;
            font-size: 12px;
        }
        .status {
            position: fixed;
            top: 20px;
            right: 15px;
            background: #10B981;
            color: white;
            padding: 12px 16px;
            border-radius: 8px;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>✨ 我的笔记本</h1>
        <p>记录每天的想法和感受</p>
    </div>
    
    <div class="container">
        <div class="date-section">
            <div class="date-controls">
                <button class="date-btn" onclick="goYesterday()">◀</button>
                <input type="date" class="date-input" id="dateInput" onchange="changeDateByInput()">
                <button class="date-btn" onclick="goTomorrow()">▶</button>
            </div>
            <div class="date-display" id="dateDisplay"></div>
        </div>
        
        <div class="toolbar">
            <div class="toolbar-row">
                <button class="toolbar-btn" onclick="applyFormat('bold')">B 加粗</button>
                <button class="toolbar-btn" onclick="applyFormat('italic')">I 倾斜</button>
            </div>
            <div class="toolbar-row">
                <button class="color-btn" style="background: #FCA5A5;" onclick="applyFormat('bg-red')" title="红色">红</button>
                <button class="color-btn" style="background: #A7F3D0;" onclick="applyFormat('bg-green')" title="绿色">绿</button>
                <button class="color-btn" style="background: #BFDBFE;" onclick="applyFormat('bg-blue')" title="蓝色">蓝</button>
                <button class="color-btn" style="background: #E9D5FF;" onclick="applyFormat('bg-purple')" title="紫色">紫</button>
            </div>
        </div>
        
        <div class="notebook-area">
            <div id="noteText" contenteditable="true" placeholder="✍️ 写下你今天的想法..."></div>
        </div>
    </div>
    
    <div class="button-group">
        <button class="save-btn" onclick="saveNote()">💾 保存</button>
    </div>
    
    <div class="footer">
        <p>💫 坚持每日记录，让生活更有意义</p>
    </div>
    
    <div class="status" id="status" style="display: none;"></div>
    
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(() => {});
        }
        
        let currentDate = new Date();
        let notesData = JSON.parse(localStorage.getItem('notes') || '{}');
        
        function updateDisplay() {
            const dateStr = currentDate.toISOString().split('T')[0];
            document.getElementById('dateInput').value = dateStr;
            const dayName = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'][currentDate.getDay()];
            document.getElementById('dateDisplay').textContent = currentDate.toLocaleDateString('zh-CN') + ' ' + dayName;
            document.getElementById('noteText').innerHTML = notesData[dateStr] || '';
        }
        
        function goYesterday() {
            currentDate.setDate(currentDate.getDate() - 1);
            updateDisplay();
        }
        
        function goTomorrow() {
            currentDate.setDate(currentDate.getDate() + 1);
            updateDisplay();
        }
        
        function changeDateByInput() {
            const input = document.getElementById('dateInput').value;
            currentDate = new Date(input + 'T00:00:00');
            updateDisplay();
        }
        

        function applyFormat(format) {
            const selection = window.getSelection();
            if (selection.toString().length === 0) {
                showStatus('请先选择文字');
                return;
            }

            const range = selection.getRangeAt(0);
            const span = document.createElement('span');
            span.dataset.formatted = 'true';

            if (format === 'bold') {
                span.style.fontWeight = 'bold';
            } else if (format === 'italic') {
                span.style.fontStyle = 'italic';
            } else if (format === 'bg-red') {
                span.style.backgroundColor = '#FCA5A5';
                span.style.color = '#000';
            } else if (format === 'bg-green') {
                span.style.backgroundColor = '#A7F3D0';
                span.style.color = '#000';
            } else if (format === 'bg-blue') {
                span.style.backgroundColor = '#BFDBFE';
                span.style.color = '#000';
            } else if (format === 'bg-purple') {
                span.style.backgroundColor = '#E9D5FF';
                span.style.color = '#000';
            }

            const fragment = range.extractContents();
            span.appendChild(fragment);
            range.insertNode(span);

            // 创建一个"重置 span"，强制恢复正常颜色和样式
            const resetSpan = document.createElement('span');
            resetSpan.dataset.reset = 'true';
            resetSpan.style.backgroundColor = 'transparent';
            resetSpan.style.color = '#92400E'; // 恢复正常颜色
            resetSpan.style.fontWeight = 'normal';
            resetSpan.style.fontStyle = 'normal';

            span.parentNode.insertBefore(resetSpan, span.nextSibling);

            // 将光标移到重置 span 内
            const newRange = document.createRange();
            newRange.setStart(resetSpan, 0);
            newRange.collapse(true);
            selection.removeAllRanges();
            selection.addRange(newRange);

            showStatus('✓ 已应用');
        }

        const noteArea = document.getElementById('noteText');

        // beforeinput 事件处理：防止格式继承
        noteArea.addEventListener('beforeinput', (e) => {
            const selection = window.getSelection();
            if (!selection.rangeCount) return;

            const range = selection.getRangeAt(0);
            let container = range.commonAncestorContainer;
            let parentNode = container.nodeType === 3 ? container.parentNode : container;

            // 如果光标在重置span内，直接允许输入（这是我们想要的）
            if (parentNode.dataset && parentNode.dataset.reset) {
                return; // 允许在重置span内输入，新文字就不会有背景色
            }

            // 如果光标在格式化span内，也允许
            if (parentNode.dataset && parentNode.dataset.formatted) {
                return;
            }

            // 检查是否有继承的背景色（不是我们的格式化或重置span）
            let current = parentNode;
            while (current && current !== noteArea) {
                if (current.dataset && (current.dataset.formatted || current.dataset.reset)) {
                    // 这是我们控制的span，允许输入
                    return;
                }

                const bgColor = window.getComputedStyle(current).backgroundColor;
                if (bgColor && bgColor !== 'rgba(0, 0, 0, 0)' && bgColor !== 'transparent') {
                    // 有背景色但不是我们的span - 这是继承的，需要清理
                    e.preventDefault();

                    // 找到最外层的格式化span
                    let outermost = current;
                    while (outermost.parentNode !== noteArea) {
                        const pbg = window.getComputedStyle(outermost.parentNode).backgroundColor;
                        if (pbg && pbg !== 'rgba(0, 0, 0, 0)' && pbg !== 'transparent') {
                            outermost = outermost.parentNode;
                        } else {
                            break;
                        }
                    }

                    // 删除这个继承的span，提取内容
                    const parent = outermost.parentNode;
                    while (outermost.firstChild) {
                        parent.insertBefore(outermost.firstChild, outermost);
                    }
                    parent.removeChild(outermost);

                    // 重新设置光标
                    const newRange = document.createRange();
                    newRange.setStart(container, range.startOffset);
                    newRange.collapse(true);
                    selection.removeAllRanges();
                    selection.addRange(newRange);

                    // 重新插入文本
                    document.execCommand('insertText', false, e.data);
                    return;
                }
                current = current.parentNode;
            }
        });

        // 输入后持续清理任何不该存在的格式化 span
        noteArea.addEventListener('input', () => {
            setTimeout(() => {
                const allSpans = noteArea.querySelectorAll('span:not([data-formatted]):not([data-reset])');
                allSpans.forEach(span => {
                    const bgColor = window.getComputedStyle(span).backgroundColor;
                    if (bgColor && bgColor !== 'rgba(0, 0, 0, 0)' && bgColor !== 'transparent') {
                        // 这个 span 有背景色但不是我们的，删除它
                        const parent = span.parentNode;
                        while (span.firstChild) {
                            parent.insertBefore(span.firstChild, span);
                        }
                        parent.removeChild(span);
                    }
                });
            }, 0);
        });
        
        function saveNote() {
            const dateStr = currentDate.toISOString().split('T')[0];
            const html = document.getElementById('noteText').innerHTML;
            notesData[dateStr] = html;
            localStorage.setItem('notes', JSON.stringify(notesData));
            showStatus('✓ 已保存');
        }
        
        function showStatus(msg) {
            const status = document.getElementById('status');
            status.textContent = msg;
            status.style.display = 'block';
            setTimeout(() => { status.style.display = 'none'; }, 1500);
        }
        
        updateDisplay();
    </script>
</body>
</html>
